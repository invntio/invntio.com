<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invntio story (EN)</title>
<style>
  @font-face {
    font-family: "Schibsted Grotesk Variable";
    src: url("schibsted-grotesk-latin-wght-normal.woff2") format("woff2");
    font-weight: 400 900;
  }
  :root {
    --green: #2cac7b;
    --green-deep: #155c40;
    --ground: #f6f7f5;
    --ink: #15181c;
    --ink-2: #4a4f57;
    --ink-3: #686d75;
    --rule: #e2e4e0;
    /* Blueprint grid, scaled up from the site's 24px so it survives a phone screen. */
    --grid-line: rgb(21 24 28 / 0.035);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background-color: var(--ground);
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
    background-size: 36px 36px;
    color: var(--ink);
    font-family: "Schibsted Grotesk Variable", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* Safe area: top 250px and bottom 300px stay free of key content. */
  .sheet {
    position: absolute;
    top: 280px; left: 96px; right: 96px; bottom: 320px;
    display: flex; flex-direction: column;
  }
  .wordmark { width: 240px; height: 53px; flex: none; display: block; color: var(--ink); }

  h1 {
    margin-top: 88px;
    font-size: 116px; font-weight: 700; line-height: 1.02; letter-spacing: -0.035em;
  }
  /* Tittle rule, as on the site: hard two-tone fill, green above 33.5%. */
  .i-dot {
    color: transparent;
    background: linear-gradient(to bottom, var(--green) 33.5%, var(--ink) 33.5%);
    -webkit-background-clip: text; background-clip: text;
  }
  .end-dot { color: var(--green); }

  /* Ruled panel: ink top rule, hairline rows, no boxes. */
  .register { margin-top: 96px; list-style: none; border-top: 2px solid var(--ink); }
  .register li {
    display: grid; grid-template-columns: 76px 1fr; align-items: baseline;
    padding: 28px 0; border-bottom: 2px solid var(--rule);
    font-size: 46px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15;
  }
  .register .n { font-size: 30px; font-weight: 500; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .trust { margin-top: 44px; font-size: 37px; line-height: 1.4; color: var(--ink-2); }

  .cta { margin-top: auto; padding-top: 48px; }
  .cta h2 { font-size: 56px; font-weight: 650; line-height: 1.08; letter-spacing: -0.025em; max-width: 860px; }
  .actions { margin-top: 40px; display: flex; align-items: center; gap: 40px; }
  .btn {
    background: var(--green-deep); color: #fff; border-radius: 12px;
    font-size: 40px; font-weight: 600; padding: 26px 46px; line-height: 1;
  }
  .domain { font-size: 44px; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
  /* EN headline runs to three lines: tighten the rhythm to keep the bottom safe area clear. */
  h1 { margin-top: 64px; }
  .register { margin-top: 72px; }
  .register li { padding: 24px 0; }
</style>
</head>
<body>
